<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Forza Motorsport 4 — HDR vs SDR</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#edf1f7;background:#0b1018}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}
main{max-width:1500px;margin:0 auto;padding:28px 24px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h1{font-size:clamp(19px,2.4vw,28px);letter-spacing:-.03em;margin:0;font-weight:700}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.segment{display:flex;gap:4px;padding:4px;background:#1a2431;border:1px solid #304051;border-radius:12px}
.segment button{border:0;background:transparent;color:#b1c0d0;padding:9px 14px;border-radius:9px;font-size:13px;font-weight:600}
.segment button[aria-pressed="true"]{background:#e8f0fa;color:#111b27}
.fullscreen{border:1px solid #39485b;color:#e0eaf5;background:#253244;border-radius:9px;padding:10px 14px;font-size:13px;font-weight:600}
.fullscreen:hover{background:#35475c}
.viewer-shell{border:1px solid #314154;border-radius:16px;overflow:hidden;background:#05080d;box-shadow:0 30px 70px #0005}
.viewer{--split:50%;width:100%;aspect-ratio:16/9;position:relative;isolation:isolate;overflow:hidden;touch-action:pan-y;cursor:ew-resize;user-select:none;-webkit-user-select:none}
.viewer img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none}
.viewer .overlay{clip-path:inset(0 calc(100% - var(--split)) 0 0)}
.divider{position:absolute;z-index:3;top:0;bottom:0;left:var(--split);width:2px;transform:translateX(-50%);background:#fff;box-shadow:0 0 14px #000b;pointer-events:none}
.handle{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:40px;height:40px;border-radius:50%;background:#f0f5fa;border:3px solid #fff;box-shadow:0 5px 30px #0008}
.handle:before{content:"";position:absolute;inset:10px 13px;border-left:2px solid #243041;border-right:2px solid #243041}
.label{position:absolute;top:16px;z-index:2;background:#090f18cc;color:#fff;border:1px solid #ffffff33;backdrop-filter:blur(6px);padding:9px 13px;border-radius:9px;font-weight:750;font-size:12px;pointer-events:none}
.label.left{left:16px}.label.right{right:16px}
:fullscreen{background:#000;border:0;border-radius:0}:fullscreen .viewer{height:100vh;aspect-ratio:auto}
@media(max-width:700px){main{padding:14px 10px}.toolbar{align-items:flex-start}.segment button{padding:8px 11px}.label{top:9px;padding:7px 9px;font-size:10px}.label.left{left:9px}.label.right{right:9px}.handle{width:34px;height:34px}}
</style>
</head>
<body>
<main>
 <div class="toolbar">
  <h1>Forza Motorsport 4 — HDR vs SDR</h1>
  <div class="controls">
   <div class="segment" role="group" aria-label="Camera view">
    <button type="button" data-scene="back" aria-pressed="true">Rear view</button>
    <button type="button" data-scene="cockpit" aria-pressed="false">Cockpit</button>
   </div>
   <button type="button" class="fullscreen" id="fullscreen">Fullscreen</button>
  </div>
 </div>
 <section class="viewer-shell" id="viewerShell">
  <div class="viewer" id="viewer" aria-label="Drag to compare HDR and SDR images">
   <img id="rightImage" alt="SDR capture" src="assets/back-sdr.avif" draggable="false">
   <img id="leftImage" class="overlay" alt="HDR capture" src="assets/back-hdr.avif" draggable="false">
   <div class="label left">HDR</div><div class="label right">SDR</div>
   <div class="divider"><span class="handle" aria-hidden="true"></span></div>
  </div>
 </section>
</main>
<script>
(()=>{
 const viewer=document.getElementById('viewer');
 const shell=document.getElementById('viewerShell');
 const left=document.getElementById('leftImage');
 const right=document.getElementById('rightImage');
 let scene='back',dragging=false;
 function setPosition(clientX){const r=viewer.getBoundingClientRect();const value=Math.max(0,Math.min(100,(clientX-r.left)/r.width*100));viewer.style.setProperty('--split',value+'%')}
 viewer.addEventListener('pointerdown',e=>{if(e.button!==0)return;dragging=true;viewer.setPointerCapture(e.pointerId);setPosition(e.clientX)});
 viewer.addEventListener('pointermove',e=>{if(dragging)setPosition(e.clientX)});
 viewer.addEventListener('pointerup',()=>dragging=false);
 viewer.addEventListener('pointercancel',()=>dragging=false);
 document.querySelectorAll('[data-scene]').forEach(b=>b.addEventListener('click',()=>{
  scene=b.dataset.scene;
  left.src=`assets/${scene}-hdr.avif`;
  right.src=`assets/${scene}-sdr.avif`;
  document.querySelectorAll('[data-scene]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.scene===scene)));
 }));
 document.getElementById('fullscreen').addEventListener('click',()=>document.fullscreenElement?document.exitFullscreen():shell.requestFullscreen());
})();
</script>
</body>
</html>
